name: CI

on:
  push:
    branches-ignore:
      - main
  pull_request:

jobs:
  pre-commit:
    name: pre-commit gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: pre-commit/action@v3.0.1
